<!DOCTYPE html>
<html>
<head>
  <title>D'Studio AR Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #111; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      font-family: sans-serif; 
    }
    model-viewer { 
      width: 100vw; 
      height: 75vh; 
    }
    #ar-button {
      margin-top: 15px;
      padding: 15px 40px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <model-viewer
    id="viewer"
    src="burger.glb"
    ios-src="burger.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    touch-action="rotate"
    interaction-prompt="auto"
    auto-rotate
    shadow-intensity="1"
    alt="Burger">

    <a 
      id="ar-button"
      slot="ar-button"
      href="burger.usdz"
      rel="ar">
      View On Your Table
    </a>

  </model-viewer>

</body>
</html>
