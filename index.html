<!DOCTYPE html>
<html>
<head>
  <title>D'Studio AR Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      background: #0a0a0a; 
      font-family: 'Helvetica Neue', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header {
      width: 100%;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    .restaurant-name {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ff6b00;
      margin-bottom: 5px;
    }

    .dish-name {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .dish-price {
      font-size: 18px;
      color: #aaa;
      margin-top: 5px;
    }

    model-viewer { 
      width: 100vw; 
      height: 55vh;
      background: transparent;
    }

    .dish-description {
      padding: 0 25px;
      text-align: center;
      font-size: 14px;
      color: #888;
      line-height: 1.6;
      margin-top: 15px;
    }

    .ar-button {
      margin-top: 20px;
      padding: 16px 50px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 1px;
    }

    .ar-button:hover {
      background: #e05a00;
    }

    .branding {
      margin-top: 30px;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .branding img {
      width: 70px;
      opacity: 0.4;
      filter: invert(1);
    }

    .branding p {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #333;
    }

  </style>
</head>
<body>

  <div class="header">
    <div class="restaurant-name">Hudson's Burger Co.</div>
    <div class="dish-name">The Classic Smash</div>
    <div class="dish-price">R 165</div>
  </div>

  <model-viewer
    id="viewer"
    src="burger.glb"
    ios-src="burger.usdz"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    touch-action="rotate"
    interaction-prompt="auto"
    auto-rotate
    shadow-intensity="1"
    alt="Burger">

    <a 
      slot="ar-button"
      class="ar-button"
      href="burger.usdz"
      rel="ar">
      👆 View On Your Table
    </a>

  </model-viewer>

  <p class="dish-description">
    Two smashed beef patties, aged cheddar, caramelised onions, 
    house pickle and our signature sauce on a toasted brioche bun.
  </p>

  <div class="branding">
    <img src="D_Studio_logo.png" alt="D'Studio">
    <p>Powered by D'Studio AR</p>
  </div>

</body>
</html>
