<!DOCTYPE html>
<html>
<head>
  <title>D'Studio AR Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 70vh; }
    .ar-button {
      margin-top: 10px;
      padding: 15px 40px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <model-viewer
    id="viewer"
    src="burger.glb"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    alt="Burger">
  </model-viewer>

  <button class="ar-button" onclick="launchAR()">
    View On Your Table
  </button>

<script>
function launchAR() {
  const modelUrl = encodeURIComponent(window.location.origin + '/burger.glb');
  const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${modelUrl}&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;`;
  window.location = intentUrl;
}
</script>

</body>
</html>
