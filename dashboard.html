<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Studio AR - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; }
        .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .auth-section { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #374151; }
        input, textarea, select { width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        button:hover { transform: translateY(-1px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .section { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .section h2 { color: #1e293b; margin-bottom: 1.5rem; font-size: 1.75rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 600; color: #374151; }
        tr:hover { background: #f8fafc; }
        .status { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.875rem; font-weight: 600; }
        .status.admin { background: #10b981; color: white; }
        .status.owner { background: #f59e0b; color: white; }
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.875rem; }
        .btn-copy { background: #10b981; }
        .btn-qr { background: #3b82f6; }
        .btn-view { background: #8b5cf6; }
        .btn-delete { background: #ef4444; }
        .hidden { display: none; }
        .loading { opacity: 0.7; pointer-events: none; }
        .error { background: #fee2e2; color: #dc2626; padding: 1rem; border-radius: 8px; margin: 1rem 0; }
        .success { background: #d1fae5; color: #065f46; padding: 1rem; border-radius: 8px; margin: 1rem 0; }
        @media (max-width: 768px) { .container { padding: 1rem; } .actions { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ D'Studio AR Dashboard</h1>
            <p>Restaurant AR Menu Platform</p>
        </div>

        <div id="authSection" class="auth-section">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="admin@dstudioar.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button onclick="signIn()">Sign In</button>
            <div id="authStatus"></div>
        </div>

        <div id="dashboard" class="hidden">
            <div class="section">
                <h2>📍 Add Restaurant</h2>
                <div class="form-group">
                    <label for="restaurantName">Restaurant Name</label>
                    <input type="text" id="restaurantName" placeholder="e.g. La Bella Italia">
                </div>
                <button onclick="addRestaurant()">Add Restaurant</button>
                <div id="restaurantStatus"></div>
            </div>

            <div id="dishesSection" class="section hidden">
                <h2>🍽️ Add Dish</h2>
                <select id="restaurantSelect"></select>
                <div class="form-group">
                    <label for="dishName">Dish Name</label>
                    <input type="text" id="dishName" placeholder="e.g. Margherita Pizza">
                </div>
                <div class="form-group">
                    <label for="dishDescription">Description</label>
                    <textarea id="dishDescription" rows="3" placeholder="Fresh ingredients..."></textarea>
                </div>
                <div class="form-group">
                    <label for="dishPrice">Price ($)</label>
                    <input type="number" id="dishPrice" step="0.01" placeholder="19.99">
                </div>
                <div class="form-group">
                    <label for="glbModel">GLB Model URL</label>
                    <input type="url" id="glbModel" placeholder="https://your-storage.supabase.co/.../pizza.glb">
                </div>
                <div class="form-group">
                    <label for="usdzModel">USDZ Model URL</label>
                    <input type="url" id="usdzModel" placeholder="https://your-storage.supabase.co/.../pizza.usdz">
                </div>
                <button onclick="addDish()">Add Dish</button>
                <div id="dishStatus"></div>
            </div>

            <div id="analyticsSection" class="section hidden">
                <h2>📊 Analytics</h2>
                <select id="analyticsRestaurantSelect" onchange="loadAnalytics()"></select>
                <div id="analyticsData"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let restaurants = [];

        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showStatus('authStatus', 'Please enter email and password', 'error');
                return;
            }

            document.body.classList.add('loading');
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                currentUser = data.user;
                await verifyAdminAccess();
            } catch (error) {
                showStatus('authStatus', `Login failed: ${error.message}`, 'error');
            } finally {
                document.body.classList.remove('loading');
            }
        }

        async function verifyAdminAccess() {
            // Double-check admin status via RLS
            const { data: userData } = await supabase
                .from('restaurants')
                .select('id')
                .eq('auth_user_id', currentUser.id)
                .single();

            if (!userData) {
                showStatus('authStatus', 'Admin access required', 'error');
                return;
            }

            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            await loadRestaurants();
        }

        async function loadRestaurants() {
            const { data, error } = await supabase
                .from('restaurants')
                .select('*')
                .eq('auth_user_id', currentUser.id)
                .order('name');

            if (error) {
                console.error('Load restaurants error:', error);
                return;
            }

            restaurants = data || [];
            populateRestaurantSelect();
            loadDishesTable();
        }

        function populateRestaurantSelect() {
            const select = document.getElementById('restaurantSelect');
            const analyticsSelect = document.getElementById('analyticsRestaurantSelect');
            
            select.innerHTML = '<option value="">Select Restaurant</option>';
            analyticsSelect.innerHTML = '<option value="">Select Restaurant</option>';

            restaurants.forEach(restaurant => {
                const option = new Option(restaurant.name, restaurant.id);
                select.appendChild(option.cloneNode(true));
                analyticsSelect.appendChild(option.cloneNode(true));
            });

            if (restaurants.length > 0) {
                document.getElementById('dishesSection').classList.remove('hidden');
                document.getElementById('analyticsSection').classList.remove('hidden');
            }
        }

        async function addRestaurant() {
            const name = document.getElementById('restaurantName').value.trim();
            if (!name) return showStatus('restaurantStatus', 'Restaurant name required', 'error');

            const { error } = await supabase
                .from('restaurants')
                .insert({ name, auth_user_id: currentUser.id });

            if (error) {
                showStatus('restaurantStatus', `Error: ${error.message}`, 'error');
            } else {
                showStatus('restaurantStatus', 'Restaurant added successfully!', 'success');
                document.getElementById('restaurantName').value = '';
                await loadRestaurants();
            }
        }

        async function addDish() {
            const restaurantId = document.getElementById('restaurantSelect').value;
            const name = document.getElementById('dishName').value.trim();
            const description = document.getElementById('dishDescription').value.trim();
            const price = parseFloat(document.getElementById('dishPrice').value);
            const glbModel = document.getElementById('glbModel').value.trim();
            const usdzModel = document.getElementById('usdzModel').value.trim();

            if (!restaurantId || !name || !price || !glbModel || !usdzModel) {
                return showStatus('dishStatus', 'All fields required', 'error');
            }

            document.body.classList.add('loading');
            try {
                // Insert dish first
                const { data: dish, error: insertError } = await supabase
                    .from('dishes')
                    .insert({
                        restaurant_id: restaurantId,
                        name,
                        description,
                        price,
                        glb_model: glbModel,
                        usdz_model: usdzModel
                    })
                    .select()
                    .single();

                if (insertError) throw insertError;

                // Auto-generate QR code
                await generateAndStoreQR(dish.id, `https://your-vercel-domain.vercel.app/dish.html?id=${dish.id}`);

                showStatus('dishStatus', 'Dish added with QR code!', 'success');
                clearDishForm();
                await loadDishesTable();
            } catch (error) {
                showStatus('dishStatus', `Error: ${error.message}`, 'error');
            } finally {
                document.body.classList.remove('loading');
            }
        }

        async function generateAndStoreQR(dishId, arUrl) {
            return new Promise((resolve, reject) => {
                const canvas = document.createElement('canvas');
                QRCode.toCanvas(canvas, arUrl, {
                    width: 400,
                    margin: 2,
                    color: {
                        dark: '#1e293b',
                        light: '#ffffff'
                    }
                }, (error) => {
                    if (error) {
                        console.error('QR generation failed:', error);
                        reject(error);
                        return;
                    }

                    // Convert canvas to base64 PNG
                    const qrPng = canvas.toDataURL('image/png');
                    
                    // Store in database
                    supabase
                        .from('dishes')
                        .update({ 
                            qr_code_png: qrPng,
                            qr_created_at: new Date().toISOString()
                        })
                        .eq('id', dishId)
                        .then(resolve)
                        .catch(reject);
                });
            });
        }

        async function loadDishesTable() {
            const restaurantId = document.getElementById('restaurantSelect').value;
            if (!restaurantId) return;

            const { data: dishes, error } = await supabase
                .from('dishes')
                .select(`
                    *,
                    dish_views(count)
                `)
                .eq('restaurant_id', restaurantId)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Load dishes error:', error);
                return;
            }

            const tbody = document.getElementById('dishesTableBody');
            tbody.innerHTML = '';

            (dishes || []).forEach(dish => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${dish.name}</td>
                    <td>${dish.description}</td>
                    <td>$${dish.price.toFixed(2)}</td>
                    <td><a href="${dish.glb_model}" target="_blank">GLB</a></td>
                    <td><a href="${dish.usdz_model}" target="_blank">USDZ</a></td>
                    <td>${dish.qr_code_png ? '✅' : '⏳'}</td>
                    <td>${dish.count || 0}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-sm btn-view" onclick="viewAR(${dish.id})">View AR</button>
                            <button class="btn-sm btn-copy" onclick="copyARLink(${dish.id}, '${dish.name}')">Copy Link</button>
                            ${dish.qr_code_png ? `<button class="btn-sm btn-qr" onclick="downloadQR(${dish.id})">Download QR</button>` : ''}
                            <button class="btn-sm btn-delete" onclick="deleteDish(${dish.id})">Delete</button>
                        </div>
                    </td>
                `;
            });
        }

        function viewAR(dishId) {
            window.open(`/dish.html?id=${dishId}`, '_blank');
        }

        async function copyARLink(dishId, dishName) {
            const arUrl = `${window.location.origin}/dish.html?id=${dishId}`;
            try {
                await navigator.clipboard.writeText(arUrl);
                alert(`AR Link copied: ${dishName}`);
            } catch {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = arUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert(`AR Link copied: ${dishName}`);
            }
        }

        async function downloadQR(dishId) {
            const { data: dish } = await supabase
                .from('dishes')
                .select('qr_code_png, name')
                .eq('id', dishId)
                .single();

            if (!dish?.qr_code_png) return;

            const link = document.createElement('a');
            link.download = `${dish.name.replace(/[^a-z0-9]/gi, '_')}_QR.png`;
            link.href = dish.qr_code_png;
            link.click();
        }

        async function deleteDish(dishId) {
            if (!confirm('Delete this dish?')) return;

            const { error } = await supabase
                .from('dishes')
                .delete()
                .eq('id', dishId);

            if (error) {
                alert(`Error: ${error.message}`);
            } else {
                await loadDishesTable();
            }
        }

        async function loadAnalytics() {
            const restaurantId = document.getElementById('analyticsRestaurantSelect').value;
            if (!restaurantId) return;

            const { data: analytics } = await supabase
                .from('dish_views')
                .select(`
                    dish_id,
                    dish:dishes(name),
                    count,
                    created_at
                `)
                .eq('restaurant_id', restaurantId)
                .order('count', { ascending: false });

            document.getElementById('analyticsData').innerHTML = `
                <table>
                    <thead>
                        <tr><th>Dish</th><th>Views</th><th>Last Viewed</th></tr>
                    </thead>
                    <tbody>
                        ${analytics?.map(a => `
                            <tr>
                                <td>${a.dish?.name || 'Unknown'}</td>
                                <td>${a.count}</td>
                                <td>${new Date(a.created_at).toLocaleDateString()}</td>
                            </tr>
                        `).join('') || '<tr><td colspan="3">No data</td></tr>'}
                    </tbody>
                </table>
            `;
        }

        function clearDishForm() {
            document.getElementById('dishName').value = '';
            document.getElementById('dishDescription').value = '';
            document.getElementById('dishPrice').value = '';
            document.getElementById('glbModel').value = '';
            document.getElementById('usdzModel').value = '';
        }

        function showStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => element.innerHTML = '', 5000);
        }

        // Auto-load dishes when restaurant changes
        document.getElementById('restaurantSelect').addEventListener('change', loadDishesTable);
    </script>

    <!-- Add dishes table template -->
    <script>
        // Inject dishes table after dashboard loads
        document.addEventListener('DOMContentLoaded', function() {
            const dishesSection = document.querySelector('#dishesSection');
            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>GLB</th>
                        <th>USDZ</th>
                        <th>QR</th>
                        <th>Views</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="dishesTableBody"></tbody>
            `;
            dishesSection.appendChild(table);
        });
    </script>
</body>
</html>
