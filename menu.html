<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Menu — D'Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #c8a96e;
      --bg: #080808;
      --surface: #101010;
      --border: #1e1e1e;
      --text: #efefef;
      --muted: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── LOADING STATE ── */
    #loadingScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }

    .loading-logo {
      width: 50px;
      filter: invert(1);
      opacity: 0.6;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    .loading-text {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── ERROR STATE ── */
    #errorScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      padding: 40px;
      text-align: center;
    }

    .error-logo {
      width: 50px;
      filter: invert(1);
      opacity: 0.4;
      margin-bottom: 8px;
    }

    .error-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text);
    }

    .error-sub {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── MAIN MENU PAGE ── */
    #menuPage {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
    }

    /* Header */
    .header {
      width: 100%;
      padding: 24px 24px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: rgba(8,8,8,0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .restaurant-name {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .dish-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 6px;
      line-height: 1.1;
    }

    .dish-price {
      font-size: 16px;
      color: var(--muted);
      letter-spacing: 2px;
    }

    /* Model viewer */
    model-viewer {
      width: 100%;
      height: 58vh;
      background: transparent;
      --poster-color: transparent;
    }

    /* Description */
    .dish-description {
      padding: 20px 28px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      max-width: 480px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    /* AR Button */
    .ar-button {
      margin: 24px auto 0;
      padding: 16px 48px;
      background: var(--accent);
      color: #080808;
      border: none;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
    }

    .ar-button:hover { opacity: 0.85; }

    /* Branding footer */
    .branding {
      margin-top: 32px;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .branding img {
      width: 40px;
      filter: invert(1);
      opacity: 0.2;
    }

    .branding p {
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #2a2a2a;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loadingScreen">
    <img src="D_Studio_logo.png" class="loading-logo" alt="D'Studio">
    <p class="loading-text">Loading AR Menu</p>
  </div>

  <!-- Error -->
  <div id="errorScreen">
    <img src="D_Studio_logo.png" class="error-logo" alt="D'Studio">
    <h1 class="error-title">Menu Not Found</h1>
    <p class="error-sub">This AR menu does not exist or has been removed.</p>
  </div>

  <!-- Menu Page -->
  <div id="menuPage">

    <div class="header">
      <div class="restaurant-name" id="restaurantName"></div>
      <div class="dish-name" id="dishName"></div>
      <div class="dish-price" id="dishPrice"></div>
    </div>

    <model-viewer
      id="viewer"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      touch-action="rotate"
      interaction-prompt="auto"
      auto-rotate
      shadow-intensity="1"
      alt="Dish">

      <a
        slot="ar-button"
        class="ar-button"
        id="iosArLink"
        rel="ar">
        View On Your Table
      </a>

    </model-viewer>

    <p class="dish-description" id="dishDescription"></p>

    <div class="branding">
      <img src="D_Studio_logo.png" alt="D'Studio">
      <p>Powered by D'Studio AR</p>
    </div>

  </div>

<script>
  const SUPABASE_URL = 'https://kynmckifaixaakpdarxn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_QW3AQ4MxIFU3u0hXhdwUVA_IMPALYbq';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    return params.get('slug');
  }

  function showError() {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('errorScreen').style.display = 'flex';
  }

  function showMenu(data) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('menuPage').style.display = 'flex';

    document.getElementById('restaurantName').textContent = data.restaurant_name;
    document.getElementById('dishName').textContent = data.dish_name;
    document.getElementById('dishPrice').textContent = data.dish_price;
    document.getElementById('dishDescription').textContent = data.dish_description || '';

    const viewer = document.getElementById('viewer');
    const iosLink = document.getElementById('iosArLink');

    // Derive USDZ url from GLB url
    const glbUrl = data.model_url;
    const usdzUrl = glbUrl.replace('.glb', '.usdz');

    viewer.setAttribute('src', glbUrl);
    viewer.setAttribute('ios-src', usdzUrl);
    iosLink.setAttribute('href', usdzUrl);

    // Android Scene Viewer fallback button
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (!isIOS) {
      iosLink.addEventListener('click', function(e) {
        e.preventDefault();
        const encoded = encodeURIComponent(glbUrl);
        const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encoded}&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;`;
        window.location = intentUrl;
      });
    }
  }

  async function loadMenu() {
    const slug = getSlug();

    if (!slug) {
      showError();
      return;
    }

    const { data, error } = await db
      .from('restaurants')
      .select('*')
      .eq('slug', slug)
      .single();

    if (error || !data) {
      showError();
      return;
    }

    showMenu(data);
  }

  loadMenu();
</script>

</body>
</html>
