<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AR Menu — D'Studio AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --gold: #c8a96e;
    --gold-dim: rgba(200,169,110,0.10);
    --bg: #080808;
    --surface: #111111;
    --border: rgba(200,169,110,0.14);
    --text: #e8e4dc;
    --muted: rgba(232,228,220,0.45);
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

  /* ── LOADING ──────────────────────────────────── */
  #loading-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    z-index: 100;
  }
  .spinner {
    width: 36px; height: 36px; border: 2px solid rgba(200,169,110,0.15);
    border-top-color: var(--gold); border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--muted); font-size: 13px; letter-spacing: 0.05em; }

  /* ── ERROR ────────────────────────────────────── */
  #error-screen {
    display: none; min-height: 100vh;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    text-align: center; padding: 40px 24px;
  }
  #error-screen h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--gold); }
  #error-screen p { color: var(--muted); font-size: 14px; max-width: 300px; }

  /* ── MAIN ─────────────────────────────────────── */
  #main { display: none; max-width: 520px; margin: 0 auto; min-height: 100vh; }

  /* ── HEADER ───────────────────────────────────── */
  .header {
    padding: 36px 24px 28px;
    background: linear-gradient(180deg, rgba(200,169,110,0.06) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  .header-restaurant {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px; font-weight: 300; letter-spacing: 0.02em;
    color: var(--text); margin-bottom: 6px;
  }
  .header-sub {
    font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .header-sub span { color: var(--gold); }

  /* ── DISHES LIST ──────────────────────────────── */
  .dishes-list { padding: 20px 16px 100px; }

  .dish-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 12px; padding: 18px 20px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer; text-decoration: none; color: inherit;
    transition: border-color 0.2s, transform 0.15s;
    position: relative; overflow: hidden;
  }
  .dish-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--gold); opacity: 0; transition: opacity 0.2s;
  }
  .dish-card:hover { border-color: rgba(200,169,110,0.35); transform: translateX(2px); }
  .dish-card:hover::before { opacity: 1; }
  .dish-card:active { transform: scale(0.99); }

  .dish-card-body { flex: 1; min-width: 0; }
  .dish-card-name {
    font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 400;
    line-height: 1.2; margin-bottom: 4px;
  }
  .dish-card-desc {
    font-size: 12px; color: var(--muted); line-height: 1.5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 220px;
  }
  .dish-card-right { flex-shrink: 0; text-align: right; }
  .dish-card-price { font-size: 15px; color: var(--gold); font-weight: 500; margin-bottom: 6px; }
  .ar-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; background: var(--gold-dim); border: 1px solid rgba(200,169,110,0.2);
    border-radius: 20px; font-size: 10px; color: var(--gold); letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── FOOTER BRAND ─────────────────────────────── */
  .footer-brand {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg); border-top: 1px solid var(--border);
    padding: 14px 24px; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .footer-brand img { height: 18px; opacity: 0.6; }
  .footer-brand span { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

  /* ── EMPTY ────────────────────────────────────── */
  .empty-dishes { text-align: center; padding: 60px 24px; color: var(--muted); }
  .empty-dishes p { font-size: 14px; }

  @media (min-width: 521px) {
    #main { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <div class="loading-text">Loading menu…</div>
</div>

<div id="error-screen">
  <h2>Menu not found</h2>
  <p>This restaurant's AR menu could not be loaded. Please check the URL or scan the QR code again.</p>
</div>

<div id="main">
  <div class="header">
    <div class="header-restaurant" id="restaurant-name"></div>
    <div class="header-sub">AR Menu &nbsp;·&nbsp; <span>Point. Tap. See it in 3D.</span></div>
  </div>

  <div class="dishes-list" id="dishes-list"></div>

  <div class="footer-brand">
    <img src="D_Studio_logo.png" alt="D'Studio" onerror="this.style.display='none'" />
    <span>Powered by D'Studio AR</span>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kynmckifaixaakpdarxn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QW3AQ4MxIFU3u0hXhdwUVA_IMPALYbq';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

async function init() {
  const params = new URLSearchParams(window.location.search);
  const restaurantSlug = params.get('restaurant');

  if (!restaurantSlug) return showError();

  try {
    const { data: restaurant, error: rErr } = await db
      .from('restaurants')
      .select('*')
      .eq('slug', restaurantSlug)
      .single();

    if (rErr || !restaurant) return showError();

    const { data: dishes, error: dErr } = await db
      .from('dishes')
      .select('*')
      .eq('restaurant_id', restaurant.id)
      .order('created_at', { ascending: true });

    if (dErr) return showError();

    renderMenu(restaurant, dishes || []);
  } catch (e) {
    showError();
  }
}

function renderMenu(restaurant, dishes) {
  document.title = `${restaurant.name} — AR Menu`;
  document.getElementById('restaurant-name').textContent = restaurant.name;

  const list = document.getElementById('dishes-list');

  if (!dishes.length) {
    list.innerHTML = '<div class="empty-dishes"><p>Menu coming soon.</p></div>';
  } else {
    list.innerHTML = dishes.map(d => {
      const url = `dish.html?restaurant=${encodeURIComponent(restaurant.slug)}&dish=${encodeURIComponent(d.slug)}`;
      const desc = d.dish_description ? d.dish_description.substring(0, 60) + (d.dish_description.length > 60 ? '…' : '') : '';
      return `
        <a class="dish-card" href="${url}">
          <div class="dish-card-body">
            <div class="dish-card-name">${escHtml(d.dish_name)}</div>
            ${desc ? `<div class="dish-card-desc">${escHtml(desc)}</div>` : ''}
          </div>
          <div class="dish-card-right">
            <div class="dish-card-price">${escHtml(d.dish_price)}</div>
            <div class="ar-badge">
              <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><circle cx="4" cy="4" r="3.5" stroke="currentColor"/><circle cx="4" cy="4" r="1.5" fill="currentColor"/></svg>
              View in AR
            </div>
          </div>
        </a>`;
    }).join('');
  }

  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}

function showError() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('error-screen').style.display = 'flex';
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
