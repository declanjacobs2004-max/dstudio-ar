<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D'Studio AR — Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #c8a96e;
      --accent-dim: rgba(200,169,110,0.1);
      --accent-border: rgba(200,169,110,0.25);
      --bg: #080808;
      --surface: #101010;
      --surface2: #161616;
      --border: #1e1e1e;
      --text: #efefef;
      --muted: #555;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--text); min-height:100vh; }

    /* LOGIN */
    #loginSection {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; min-height:100vh; padding:40px 20px;
      background:radial-gradient(ellipse at 50% 0%, rgba(200,169,110,0.06) 0%, transparent 70%);
    }
    .login-logo { width:56px; filter:invert(1); opacity:0.85; margin-bottom:16px; }
    .login-title { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; letter-spacing:7px; text-transform:uppercase; margin-bottom:4px; }
    .login-rest-name { font-size:12px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; margin-bottom:48px; min-height:20px; }
    .login-box { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:36px; width:100%; max-width:400px; }
    .login-box label { display:block; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
    .login-box input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:13px 15px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; outline:none; transition:border-color 0.2s; margin-bottom:16px; }
    .login-box input:focus { border-color:var(--accent); }
    .error-msg { color:#e05555; font-size:12px; text-align:center; margin-bottom:12px; display:none; }
    .btn-primary { width:100%; padding:15px; background:var(--accent); color:#080808; border:none; border-radius:50px; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; letter-spacing:3px; text-transform:uppercase; cursor:pointer; transition:opacity 0.2s; }
    .btn-primary:hover { opacity:0.85; }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-secondary { background:transparent; border:1px solid var(--border); color:var(--muted); padding:8px 18px; border-radius:50px; font-family:'DM Sans',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all 0.2s; }
    .btn-secondary:hover { border-color:var(--accent); color:var(--accent); }

    /* ANALYTICS */
    #analyticsSection { display:none; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:18px 32px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(8,8,8,0.96); backdrop-filter:blur(16px); z-index:100; }
    .topbar-left { display:flex; align-items:center; gap:14px; }
    .topbar-logo { width:32px; filter:invert(1); opacity:0.8; }
    .topbar-info {}
    .topbar-title { font-family:'Cormorant Garamond',serif; font-size:17px; font-weight:400; letter-spacing:4px; text-transform:uppercase; line-height:1.1; }
    .topbar-rest { font-size:10px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; }
    .topbar-right { display:flex; gap:12px; align-items:center; }

    .main { max-width:1100px; margin:0 auto; padding:28px 32px; }
    @media(max-width:700px) { .main { padding:20px; } .topbar { padding:16px 20px; } }

    /* STATS */
    .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:20px; }
    @media(max-width:700px) { .stats-grid { grid-template-columns:1fr 1fr; } }
    @media(max-width:400px) { .stats-grid { grid-template-columns:1fr; } }
    .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 22px; }
    .stat-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .stat-value { font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:300; color:var(--accent); line-height:1; margin-bottom:4px; }
    .stat-sub { font-size:11px; color:var(--muted); }
    .stat-up { color:#4caf50; }
    .stat-down { color:#e05555; }

    /* PANELS */
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:24px; margin-bottom:20px; }
    .panel-title { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--accent); margin-bottom:20px; display:flex; align-items:center; gap:12px; }
    .panel-title::after { content:''; flex:1; height:1px; background:var(--border); }
    .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
    @media(max-width:700px) { .charts-grid { grid-template-columns:1fr; } }
    .chart-panel { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:24px; }
    .chart-panel .panel-title { margin-bottom:16px; }
    .chart-wrap { position:relative; height:220px; }

    /* LEADERBOARD */
    .dish-row { display:flex; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); gap:12px; }
    .dish-row:last-child { border-bottom:none; }
    .dish-rank { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:300; color:var(--accent); width:32px; flex-shrink:0; line-height:1; }
    .dish-row-info { flex:1; min-width:0; }
    .dish-row-name { font-size:14px; font-weight:500; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dish-row-bar-wrap { height:4px; background:var(--border); border-radius:4px; margin-top:6px; }
    .dish-row-bar { height:4px; background:var(--accent); border-radius:4px; transition:width 0.6s ease; }
    .dish-row-count { font-size:13px; color:var(--accent); font-weight:500; white-space:nowrap; flex-shrink:0; }

    .empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-size:11px; letter-spacing:2px; text-transform:uppercase; }
    .loading-state { text-align:center; padding:32px; color:var(--muted); font-size:11px; letter-spacing:3px; text-transform:uppercase; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginSection">
  <img src="D_Studio_logo.png" class="login-logo" alt="D'Studio">
  <h1 class="login-title">Analytics</h1>
  <p class="login-rest-name" id="loginRestName">Loading...</p>
  <div class="login-box">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <p class="error-msg" id="errorMsg">Incorrect email or password.</p>
    <button class="btn-primary" id="loginBtn" onclick="login()">View Analytics</button>
  </div>
</div>

<!-- ANALYTICS -->
<div id="analyticsSection">
  <div class="topbar">
    <div class="topbar-left">
      <img src="D_Studio_logo.png" class="topbar-logo" alt="D'Studio">
      <div class="topbar-info">
        <div class="topbar-title">D'Studio AR</div>
        <div class="topbar-rest" id="topbarRestName"></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-secondary" onclick="refreshData()">Refresh</button>
      <button class="btn-secondary" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main">
    <div id="analyticsContent"><div class="loading-state">Loading analytics...</div></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kynmckifaixaakpdarxn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QW3AQ4MxIFU3u0hXhdwUVA_IMPALYbq';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRestaurant = null;
let chartInstances = {};

function getRestaurantSlug() {
  return new URLSearchParams(window.location.search).get('restaurant');
}

// ── LOAD RESTAURANT NAME FOR LOGIN SCREEN ──
async function loadRestaurantName() {
  const slug = getRestaurantSlug();
  if (!slug) {
    document.getElementById('loginRestName').textContent = 'Invalid link';
    return;
  }
  const { data } = await db.from('restaurants').select('name').eq('slug', slug).single();
  document.getElementById('loginRestName').textContent = data ? data.name : 'Restaurant not found';
}

// ── LOGIN ──
async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');

  if (!email || !password) {
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('errorMsg').textContent = 'Please enter email and password.';
    return;
  }

  btn.textContent = 'Signing in...';
  btn.disabled = true;

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  btn.textContent = 'View Analytics';
  btn.disabled = false;

  if (error || !data.session) {
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('errorMsg').textContent = 'Incorrect email or password.';
    return;
  }

  // Fetch restaurant by slug then verify ownership in code
  const slug = getRestaurantSlug();
  const { data: restData, error: restError } = await db
    .from('restaurants')
    .select('*')
    .eq('slug', slug)
    .single();

  if (restError || !restData) {
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('errorMsg').textContent = 'Restaurant not found.';
    await db.auth.signOut();
    return;
  }

  // Verify ownership in code
  if (restData.auth_user_id !== data.session.user.id) {
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('errorMsg').textContent = 'Access denied for this restaurant.';
    await db.auth.signOut();
    return;
  }

  currentRestaurant = restData;
  showAnalytics();
}

async function logout() {
  await db.auth.signOut();
  currentRestaurant = null;
  document.getElementById('analyticsSection').style.display = 'none';
  document.getElementById('loginSection').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('errorMsg').style.display = 'none';
}

function showAnalytics() {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('analyticsSection').style.display = 'block';
  document.getElementById('topbarRestName').textContent = currentRestaurant.name;
  loadAnalytics();
}

async function refreshData() {
  document.getElementById('analyticsContent').innerHTML = '<div class="loading-state">Refreshing...</div>';
  // Destroy existing charts
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};
  loadAnalytics();
}

// ── MAIN ANALYTICS LOAD ──
async function loadAnalytics() {
  try {
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - 7); weekStart.setHours(0,0,0,0);
    const lastWeekStart = new Date(now); lastWeekStart.setDate(now.getDate() - 14); lastWeekStart.setHours(0,0,0,0);
    const monthStart = new Date(now); monthStart.setDate(now.getDate() - 28); monthStart.setHours(0,0,0,0);

    // Fetch all views for this restaurant in last 28 days
    const { data: allViews, error: viewsError } = await db
      .from('dish_views')
      .select('*, dishes(dish_name)')
      .eq('restaurant_id', currentRestaurant.id)
      .gte('viewed_at', monthStart.toISOString())
      .order('viewed_at', { ascending: true });

    if (viewsError) throw new Error(viewsError.message);

    // Fetch all dishes for this restaurant
    const { data: dishes, error: dishesError } = await db
      .from('dishes')
      .select('*')
      .eq('restaurant_id', currentRestaurant.id);

    if (dishesError) throw new Error(dishesError.message);

    const thisWeekViews = allViews.filter(v => new Date(v.viewed_at) >= weekStart);
    const lastWeekViews = allViews.filter(v => new Date(v.viewed_at) >= lastWeekStart && new Date(v.viewed_at) < weekStart);

    const thisWeekCount = thisWeekViews.length;
    const lastWeekCount = lastWeekViews.length;
    const weekChange = lastWeekCount === 0 ? (thisWeekCount > 0 ? 100 : 0) : Math.round(((thisWeekCount - lastWeekCount) / lastWeekCount) * 100);

    // Device split
    const iosViews = thisWeekViews.filter(v => v.device_type === 'ios').length;
    const androidViews = thisWeekViews.filter(v => v.device_type === 'android').length;
    const iosPct = thisWeekCount > 0 ? Math.round((iosViews / thisWeekCount) * 100) : 0;

    // Dish view counts this week
    const dishCounts = {};
    thisWeekViews.forEach(v => {
      const name = v.dishes?.dish_name || 'Unknown';
      dishCounts[name] = (dishCounts[name] || 0) + 1;
    });
    const sortedDishes = Object.entries(dishCounts).sort((a,b) => b[1] - a[1]);
    const topDish = sortedDishes[0]?.[0] || '—';
    const bottomDish = sortedDishes[sortedDishes.length - 1]?.[0] || '—';

    // Daily views for trend chart (last 28 days)
    const dailyMap = {};
    for (let i = 27; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(now.getDate() - i);
      const key = d.toISOString().split('T')[0];
      dailyMap[key] = 0;
    }
    allViews.forEach(v => {
      const key = v.viewed_at.split('T')[0];
      if (dailyMap[key] !== undefined) dailyMap[key]++;
    });

    // Hourly views this week
    const hourlyMap = Array(24).fill(0);
    thisWeekViews.forEach(v => {
      const h = new Date(v.viewed_at).getHours();
      hourlyMap[h]++;
    });

    renderAnalytics({
      thisWeekCount, lastWeekCount, weekChange,
      iosPct, androidPct: 100 - iosPct, iosViews, androidViews,
      topDish, bottomDish,
      sortedDishes, dailyMap, hourlyMap,
      totalDishes: dishes.length
    });

  } catch (e) {
    document.getElementById('analyticsContent').innerHTML = `<div class="empty-state">Error loading analytics: ${e.message}</div>`;
  }
}

function renderAnalytics(d) {
  const changeClass = d.weekChange >= 0 ? 'stat-up' : 'stat-down';
  const changeStr = (d.weekChange >= 0 ? '+' : '') + d.weekChange + '%';

  const html = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Views This Week</div>
        <div class="stat-value">${d.thisWeekCount}</div>
        <div class="stat-sub ${changeClass}">${changeStr} vs last week</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Views Last Week</div>
        <div class="stat-value">${d.lastWeekCount}</div>
        <div class="stat-sub">Previous 7 days</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">iPhone vs Android</div>
        <div class="stat-value">${d.iosPct}%</div>
        <div class="stat-sub">iPhone · ${100 - d.iosPct}% Android</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Top Dish This Week</div>
        <div class="stat-value" style="font-size:22px;margin-top:4px;">${d.topDish}</div>
        <div class="stat-sub">Most AR views</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Least Viewed</div>
        <div class="stat-value" style="font-size:22px;margin-top:4px;">${d.bottomDish}</div>
        <div class="stat-sub">Least AR views</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Dishes</div>
        <div class="stat-value">${d.totalDishes}</div>
        <div class="stat-sub">On your AR menu</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-panel">
        <div class="panel-title">28-Day Trend</div>
        <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
      </div>
      <div class="chart-panel">
        <div class="panel-title">Peak Hours This Week</div>
        <div class="chart-wrap"><canvas id="hourlyChart"></canvas></div>
      </div>
      <div class="chart-panel">
        <div class="panel-title">Device Split This Week</div>
        <div class="chart-wrap"><canvas id="deviceChart"></canvas></div>
      </div>
      <div class="panel" style="margin-bottom:0;">
        <div class="panel-title">Dish Leaderboard</div>
        <div id="leaderboard">
          ${d.sortedDishes.length === 0
            ? '<div class="empty-state">No views this week yet.</div>'
            : d.sortedDishes.map((item, i) => {
                const maxCount = d.sortedDishes[0][1];
                const pct = maxCount > 0 ? Math.round((item[1] / maxCount) * 100) : 0;
                return `
                  <div class="dish-row">
                    <div class="dish-rank">${i + 1}</div>
                    <div class="dish-row-info">
                      <div class="dish-row-name">${item[0]}</div>
                      <div class="dish-row-bar-wrap"><div class="dish-row-bar" style="width:${pct}%"></div></div>
                    </div>
                    <div class="dish-row-count">${item[1]} view${item[1] !== 1 ? 's' : ''}</div>
                  </div>
                `;
              }).join('')
          }
        </div>
      </div>
    </div>
  `;

  document.getElementById('analyticsContent').innerHTML = html;

  const chartDefaults = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
  };

  const gridColor = '#1e1e1e';
  const tickColor = '#555';

  // Trend chart
  const trendLabels = Object.keys(d.dailyMap).map(k => {
    const parts = k.split('-');
    return `${parts[2]}/${parts[1]}`;
  });

  chartInstances.trend = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels: trendLabels,
      datasets: [{
        data: Object.values(d.dailyMap),
        borderColor: '#c8a96e',
        backgroundColor: 'rgba(200,169,110,0.08)',
        borderWidth: 2,
        pointRadius: 0,
        fill: true,
        tension: 0.4,
      }]
    },
    options: {
      ...chartDefaults,
      scales: {
        x: { ticks: { color: tickColor, maxTicksLimit: 7, font: { size: 10 } }, grid: { color: gridColor } },
        y: { ticks: { color: tickColor, font: { size: 10 } }, grid: { color: gridColor }, beginAtZero: true }
      }
    }
  });

  // Hourly chart
  chartInstances.hourly = new Chart(document.getElementById('hourlyChart'), {
    type: 'bar',
    data: {
      labels: Array.from({length:24}, (_,i) => i + 'h'),
      datasets: [{
        data: d.hourlyMap,
        backgroundColor: 'rgba(200,169,110,0.6)',
        borderRadius: 4,
      }]
    },
    options: {
      ...chartDefaults,
      scales: {
        x: { ticks: { color: tickColor, font: { size: 9 }, maxTicksLimit: 12 }, grid: { color: gridColor } },
        y: { ticks: { color: tickColor, font: { size: 10 } }, grid: { color: gridColor }, beginAtZero: true }
      }
    }
  });

  // Device doughnut
  chartInstances.device = new Chart(document.getElementById('deviceChart'), {
    type: 'doughnut',
    data: {
      labels: ['iPhone', 'Android'],
      datasets: [{
        data: [d.iosViews, d.androidViews],
        backgroundColor: ['#c8a96e', '#3a3020'],
        borderColor: '#080808',
        borderWidth: 3,
      }]
    },
    options: {
      ...chartDefaults,
      plugins: {
        legend: {
          display: true,
          position: 'bottom',
          labels: { color: '#555', font: { size: 11 }, padding: 16, boxWidth: 12 }
        }
      },
      cutout: '65%',
    }
  });
}

// ── ENTER KEY ──
document.addEventListener('keypress', function(e) {
  if (e.key === 'Enter' && document.getElementById('loginSection').style.display !== 'none') login();
});

// ── INIT ──
(async () => {
  await loadRestaurantName();

  // Check if already logged in
  const { data } = await db.auth.getSession();
  if (data.session) {
    const slug = getRestaurantSlug();
    const { data: restData } = await db
      .from('restaurants')
      .select('*')
      .eq('slug', slug)
      .single();

    if (restData && restData.auth_user_id === data.session.user.id) {
      currentRestaurant = restData;
      showAnalytics();
    }
  }
})();
</script>
</body>
</html>
